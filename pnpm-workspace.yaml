packages:
  - packages/*
  - packages/extensions/*
  - apps/*
  - apps/examples/*
  - e2e/*

syncInjectedDepsAfterScripts:
  - build

# @orpc peer-pins every sibling package to the identical version (tanstack-query@1.15.0
# peer-requires client@1.15.0 exactly), so a caret range is unsafe on any fresh install:
# it can resolve two different @orpc releases and split the pair. Single-sourcing the
# version here means every manifest's "catalog:" resolves to the same exact release.
catalog:
  '@modelcontextprotocol/sdk': ^1.32.2
  '@orpc/client': 1.16.1
  '@orpc/contract': 1.16.1
  '@orpc/server': 1.16.1
  '@orpc/standard-server': 1.16.1
  '@orpc/standard-server-peer': 1.16.1
  '@orpc/tanstack-query': 1.16.1

  # The @tanstack/ai family is single-sourced here so every manifest resolves "catalog:" to the
  # same release and pnpm never installs two copies of @tanstack/ai.
  '@tanstack/ai': 1.0.1
  '@tanstack/ai-client': 1.0.1
  '@tanstack/ai-persistence': 1.0.1
  '@tanstack/ai-code-mode': 1.0.1
  '@tanstack/ai-isolate-node': 1.0.0
  '@tanstack/ai-isolate-quickjs': 1.0.0
