packages:
  - packages/*
  - packages/extensions/*
  - apps/*
  - apps/examples/*
  - e2e/*

syncInjectedDepsAfterScripts:
  - build

# @orpc peer-pins every sibling package to the identical version (tanstack-query@1.15.0
# peer-requires client@1.15.0 exactly), so a caret range is unsafe on any fresh install:
# it can resolve two different @orpc releases and split the pair. Single-sourcing the
# version here means every manifest's "catalog:" resolves to the same exact release.
catalog:
  '@orpc/client': 1.16.1
  '@orpc/contract': 1.16.1
  '@orpc/server': 1.16.1
  '@orpc/standard-server': 1.16.1
  '@orpc/standard-server-peer': 1.16.1
  '@orpc/tanstack-query': 1.16.1

  # The @tanstack/ai family moved to caret peer ranges as of 0.48.0 (each sibling
  # peer-requires "@tanstack/ai": "^0.48.0" etc rather than an exact pin), so a single
  # resolvable line is no longer load-bearing the way it was pre-0.48 — but the whole family
  # is still single-sourced here so every manifest resolves "catalog:" to the same release
  # and pnpm never installs two copies of @tanstack/ai.
  '@tanstack/ai': 0.51.0
  '@tanstack/ai-client': 0.29.1
  '@tanstack/ai-persistence': 0.5.3
  '@tanstack/ai-code-mode': 0.4.6
