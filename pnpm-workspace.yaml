packages:
  - packages/*
  - packages/extensions/*
  - apps/*
  - apps/examples/*
  - e2e/*

syncInjectedDepsAfterScripts:
  - build

# @orpc peer-pins every sibling package to the identical version (tanstack-query@1.15.0
# peer-requires client@1.15.0 exactly), so a caret range is unsafe on any fresh install:
# it can resolve two different @orpc releases and split the pair. Single-sourcing the
# version here means every manifest's "catalog:" resolves to the same exact release.
catalog:
  '@orpc/client': 1.14.7
  '@orpc/contract': 1.14.7
  '@orpc/server': 1.14.7
  '@orpc/standard-server': 1.14.7
  '@orpc/standard-server-peer': 1.14.7
  '@orpc/tanstack-query': 1.14.7

  # The @tanstack/ai family pins the same way: ai-isolate-node@0.1.49 and ai-isolate-quickjs@0.2.0
  # each peer-require ai-code-mode@0.3.10 exactly, ai-code-mode depends on @tanstack/ai@0.43.1
  # exactly, and ai-client/ai-mcp/ai-solid each pin their sibling exactly too. Mixing lines
  # installs two copies of @tanstack/ai and splits its runtime and types, so the whole family is
  # single-sourced here and every manifest resolves "catalog:" to the same release.
  '@tanstack/ai': 0.43.1
  '@tanstack/ai-client': 0.23.1
  '@tanstack/ai-code-mode': 0.3.10
  '@tanstack/ai-isolate-node': 0.1.49
  '@tanstack/ai-isolate-quickjs': 0.2.0
  '@tanstack/ai-mcp': 0.2.7
  '@tanstack/ai-solid': 0.16.1

