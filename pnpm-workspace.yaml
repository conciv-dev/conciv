overrides:
  # lodash-es _.template code injection (GHSA-r5fr-rjxr-66jc); npm never shipped 4.17.24, the
  # patched line is 4.18.x. Pulled in transitively via @excalidraw in the whiteboard extension.
  lodash-es@<4.18.0: '>=4.18.1'
  # Remaining dependabot alerts (2026-07) where every upstream parent, including its latest
  # release, hard-pins a vulnerable version. Floors move them to the patched line without
  # crossing a major. Drop each once the parent ships a fix.
  # @excalidraw/excalidraw pins nanoid 3.3.3 exact (predictable-id advisory).
  nanoid@<3.3.8: '>=3.3.8 <4'
  # @excalidraw/mermaid-to-excalidraw pins nanoid 4.0.2 exact; the only patched line is 5.x,
  # which is API-compatible for its plain nanoid() usage.
  'nanoid@>=4.0.0 <5.0.9': '>=5.0.9 <6'
  # next (incl. latest 16.x) pins postcss 8.4.31 exact (</style> XSS advisory).
  postcss@<8.5.10: '>=8.5.10 <9'
  # @netlify/otel (via nitro>unstorage>@netlify/blobs) pins @opentelemetry/core 2.7.1 exact.
  '@opentelemetry/core@<2.8.0': '>=2.8.0 <3'
  # @tailwindcss/typography (incl. latest 0.5.20) pins postcss-selector-parser 6.0.10 exact.
  postcss-selector-parser@<6.1.5: '>=6.1.5 <7'

# drizzle-kit 1.0.0-rc ships without a drizzle-orm dependency/peer yet requires
# `drizzle-orm/_relations` at runtime, assuming a flat node_modules. Under pnpm's isolated
# layout that require falls back to the hidden-hoisted drizzle-orm, which can be the
# whiteboard extension's stable 0.45.x (no `_relations` export) and crashes. Declare the
# missing peer so each consumer's own drizzle-orm is linked beside its drizzle-kit.
# Scoped to the 1.0 line (@conciv/db pins 1.0.0-rc.4); drop when drizzle-kit 1.0 stable
# fixes its manifest.
packageExtensions:
  'drizzle-kit@>=1.0.0-0 <2':
    peerDependencies:
      drizzle-orm: '*'
  # nitro-nightly is published under the name `nitro-nightly` but self-imports subpaths by its
  # canonical name (`nitro/runtime/meta`), so node's package self-reference doesn't apply. Consumers
  # alias it (`nitro: npm:nitro-nightly@...`); under pnpm's isolated layout the bare `nitro` walk-up
  # lands on the hidden-hoisted copy, which can be a different nightly (or stable nitro) without the
  # imported subpath export. Declare the missing peer so each consumer's own `nitro` alias is linked
  # beside its nitro-nightly. Drop when nitro ships stable (no alias) or the nightly self-references.
  nitro-nightly:
    peerDependencies:
      nitro: '*'

# Supply-chain hardening (pnpm 11). Only these deps may run install/build scripts;
# everything else is blocked by strictDepBuilds (default on in pnpm 11).
# Dev-only tooling and its native deps are blocked - not needed to build, test,
# or publish, and a blocked script is one less worm entry point.
allowBuilds:
  esbuild: true
  lightningcss: true
  workerd: true
  '@parcel/watcher': false
  sharp: false
  unix-dgram: false
  unrs-resolver: false
  protobufjs: false
  '@swc/core': false
  # Node-side ONNX runtime pulled in by @huggingface/transformers; the site demo runs
  # inference in the browser (onnxruntime-web), so the native binary is never used.
  onnxruntime-node: false
  # Native isolate sandbox used by @tanstack/ai-isolate-node (core Code Mode): must compile.
  isolated-vm: true
  # Replaced by @lydell/node-pty (prebuilds, no install script); upstream must stay blocked.
  node-pty: false

# Gate dependency *resolution* (lockfile updates on dev machines): don't pick npm
# versions younger than 48h, so a poisoned release is likely yanked before it ever
# enters the lockfile. CI runs --frozen-lockfile and never re-resolves, so there the
# real controls are the reviewed lockfile + Socket Firewall, not this cooldown.
minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  # TanStack releases in lockstep trains (the @tanstack/ai family, router/start, virtual) that
  # publish faster than the 48h window; the whole scope is exempt and reviewed on each bump.
  - '@tanstack/*'
  # Locked versions still inside the 48h window. Remove each once it has aged out.
  - 'lucide-react'
  - 'lucide-solid'
  - 'tsdown'
patchedDependencies:
  # createEventAwareBindings (dist/esm/bindings/tool-to-binding.js:73-115 in 1.0.1) emits
  # code_mode:external_call / external_result / external_error with no call id, so parallel child calls
  # cannot be paired into cards and aroundCalls cannot add one. The patch mints one callId per call and
  # stamps it on the call and on its result or error, and hands it to the binding as toolCallId so a
  # tool knows which call it is answering. Drop it once upstream carries a call id there.
  '@tanstack/ai-code-mode@1.0.1': patches/@tanstack__ai-code-mode@1.0.1.patch
  # LocalProcessProvider.destroy(id) only retries the dir (src/provider.ts:129-133 in 1.0.0); it never
  # reaches the handle that spawned the CLI, so a stopped turn leaves the agent running. The patch tracks
  # minted handles and destroys one through its own destroy (SIGTERM, then SIGKILL after 5s): the handle
  # whose run signal was aborted with RUN_CANCEL_REASON, so a stop never kills another session's CLI on the
  # shared dir. Its teardown also waits for the whole process group, not just the sh wrapper, before
  # deciding to escalate: a journaled agent outlives a wrapper that SIGTERM killed. Drop it once upstream
  # kills the tree there.
  '@tanstack/ai-sandbox-local-process@1.0.0': patches/@tanstack__ai-sandbox-local-process@1.0.0.patch
  # withSandbox declares ProjectionCapability in provides unconditionally (src/middleware.ts:502 in 1.0.0)
  # but only provides it for a definition with a workspace (src/middleware.ts:891-892), so every
  # workspace-less run fails the engine's provides check; and it builds the projection root through
  # resolveHarnessCwd (src/middleware.ts:894), a host path where the sandbox expects a virtual one.
  # Its tool-history recorder (src/tool-history.ts) also drops each call's TOOL_CALL_START metadata and the
  # result's output-error state, so a reload loses code-mode nesting (parentToolCallId) and shows failed
  # calls as successes; the patch keeps both. It also records the assistant message with no id, so
  # conversion mints a fresh one on every read; the patch stores one from generateMessageId. Drop the patch
  # once upstream fixes all four.
  '@tanstack/ai-sandbox@1.0.0': patches/@tanstack__ai-sandbox@1.0.0.patch
  # vitest-dev/vitest#11709: read cached server modules as utf-8 (fixes #11682 code.charCodeAt crash); drop once a vitest release includes it
  vitest@5.0.5: patches/vitest@5.0.5.patch
