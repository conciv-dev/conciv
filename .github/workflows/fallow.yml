name: Fallow

on:
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI runners are dedicated; re-uncap turbo (turbo.json caps local runs at 50%).
env:
  TURBO_CONCURRENCY: '100%'

jobs:
  fallow:
    name: Fallow audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0 # keep in sync with packageManager in package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      # Same key/restore policy as ci.yml: scoped within a lockfile generation,
      # split restore/save so successful builds persist even when the audit fails,
      # github.job disambiguates from ci.yml's save on the same sha.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.job }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
          firewall-version: 1.13.1 # pinned: 'latest' does a GitHub Releases lookup that flakes CI
      - run: sfw pnpm i --frozen-lockfile
      - run: pnpm exec turbo run build --filter='./packages/*' --filter='./packages/extensions/*'
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: always()
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.job }}-${{ github.sha }}-${{ github.run_attempt }}
      - uses: fallow-rs/fallow@ecf5a314fd3e10974acb4f5a7f867c433030522d
        with:
          command: audit
          fail-on-issues: 'true'
          auto-changed-since: 'true'
          annotations: 'true'
      # Boundary violations are a whole-graph check, not a changed-files audit finding
      # (fallow audit does not evaluate boundaries.* config), so it needs its own step.
      - run: pnpm exec fallow dead-code --boundary-violations
