name: Packed

# The packed install suites build the @conciv closure, `pnpm pack` it and install the
# tarballs into throwaway consumer fixtures, the way an npm user gets conciv. They are
# the only place pack runs: `pnpm test`, `test:e2e` and the CI planner never select
# them, and nobody runs them locally. Each suite is a `test:packed` script:
#   - vitest packages tag the describes `packed` (skipped outside `vitest --mode packed`)
#   - e2e/nextjs keeps its packed specs as tests/packed-*.spec.ts, run by
#     playwright.packed.config.ts (the default config ignores them)
#   - e2e/vite-react-packed is packed end to end
# The fixture lockfiles are refreshed here too: dispatch this workflow with
# update-lockfiles on the branch, download the packed-fixture-locks artifact and
# commit the files it holds (paths are repo-relative).
on:
  pull_request:
    paths:
      - .github/workflows/packed.yml
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - packages/**/package.json
      - packages/**/tsdown*.config.ts
      - packages/mascot/tests/unit/**
      - packages/mascot/vitest.config.ts
      - packages/mascot-react/tests/unit/**
      - packages/mascot-react/vitest.config.ts
      - packages/extensions/tanstack/test/tanstack.test.ts
      - packages/extensions/tanstack/vitest.config.ts
      - e2e/e2e-utils/**
      - e2e/vite-react-packed/**
      - e2e/nextjs/packed/**
      - e2e/nextjs/tests/packed-*.spec.ts
      - e2e/nextjs/playwright.packed.config.ts
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update-lockfiles:
        description: Regenerate the packed fixture lockfiles and upload them as the packed-fixture-locks artifact instead of running the suites
        type: boolean
        default: false

concurrency:
  group: packed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  TURBO_CONCURRENCY: '100%'

jobs:
  packed:
    name: packed install suites
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Same Playwright image as ci.yml (its repo checks guard the tag against the lockfile).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --user 1001 --init --ipc=host
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.7.0 # keep in sync with packageManager in package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      # Restore only: this workflow never saves a cache, so a PR run cannot seed one.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-node26-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-node26-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: 1.16.0 # pinned: 'latest' does a GitHub Releases lookup that flakes CI
      - run: sfw pnpm i --frozen-lockfile # Socket Firewall blocks known-malicious packages at install

      - name: Regenerate fixture lockfiles
        if: inputs.update-lockfiles
        run: |
          pnpm --filter conciv-e2e-vite-react-packed run update-packed-lockfile
          pnpm --filter conciv-e2e-nextjs run update-packed-lockfile
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.update-lockfiles
        with:
          name: packed-fixture-locks
          path: |
            e2e/vite-react-packed/fixture-lock.yaml
            e2e/nextjs/packed/fixture-lock.yaml
          if-no-files-found: error

      # The vitest suites pack the package's own dist (and tanstack its prod closure),
      # so build those first; the e2e suites build their closure themselves.
      - name: Build packed packages
        if: ${{ !inputs.update-lockfiles }}
        run: pnpm exec turbo run build --filter=@conciv/mascot --filter=@conciv/mascot-react --filter=@conciv/extension-tanstack
      # Each suite runs even when an earlier one failed, so one run reports them all.
      - name: mascot
        if: ${{ !inputs.update-lockfiles && !cancelled() }}
        run: pnpm --filter @conciv/mascot run test:packed
      - name: mascot-react
        if: ${{ !inputs.update-lockfiles && !cancelled() }}
        run: pnpm --filter @conciv/mascot-react run test:packed
      - name: extension-tanstack
        if: ${{ !inputs.update-lockfiles && !cancelled() }}
        run: pnpm --filter @conciv/extension-tanstack run test:packed
      - name: nextjs
        if: ${{ !inputs.update-lockfiles && !cancelled() }}
        run: pnpm --filter conciv-e2e-nextjs run test:packed
      - name: vite-react-packed
        if: ${{ !inputs.update-lockfiles && !cancelled() }}
        run: pnpm --filter conciv-e2e-vite-react-packed run test:packed
