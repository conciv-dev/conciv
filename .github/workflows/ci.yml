name: CI

on:
  workflow_call: {}
  pull_request: {}
  # Standalone run on main keeps the Actions caches (turbo/pnpm) warm
  # for PRs, which can only restore from their own merge ref or main, and publishes
  # the ci-test-timings artifact the planner reads. Release.yml also calls this
  # workflow, but its concurrency group cancels superseded runs on fast merge
  # trains, so main needs its own run. Superseded standalone main runs are
  # cancelled too (see concurrency below): the newest one still lands the caches
  # and the timings for the latest main commit.
  push:
    branches: [main]

# One live run per PR and one per main push: a newer push cancels the older run so
# the 20-job org cap goes to current work. Inside a reusable workflow the github
# context is the caller's, so github.workflow reads "Release" when release.yml
# calls this file and "CI" on a standalone run. The ci- prefix keeps the called
# run's group apart from release.yml's own group (Release-<ref>), which would
# otherwise collide and cancel the caller, and the workflow name keeps a release
# call and a standalone main push from cancelling each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# turbo.json caps local turbo runs at 50% concurrency so the workstation stays
# usable during builds. CI runners are dedicated, so every workflow that drives
# turbo re-uncaps it here: env beats the config file, keeping shards fully parallel.
env:
  TURBO_CONCURRENCY: '100%'

jobs:
  # Package suites are sharded across runners so the big whiteboard IT suite and
  # the real-browser suites stop starving each other on one 4-vCPU runner, with
  # every shard fully uncapped (TURBO_CONCURRENCY=100% at the workflow env level
  # overrides turbo.json's local 50% default; no VITEST_MAX_WORKERS). The
  # planner derives the matrix instead of a hand-maintained package list: it
  # enumerates workspace packages, weighs each by its measured suite duration
  # from the ci-test-timings artifact (published by the last main push; unknown
  # packages get a small default), and LPT-bin-packs into as many shards as the
  # total time warrants. New packages are picked up automatically; the split
  # re-balances itself as timings drift. Node 26 strips types natively, so the
  # planner runs from source with no install. First run ever (no timings
  # artifact yet) packs everything into two default-weight shards — one slow
  # bootstrap run on main, then it self-heals.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # download the ci-test-timings artifact from the latest main run
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # Baseline artifacts are NOT ref-scoped like caches: any PR run can upload an
      # artifact under any name, and a repo-wide latest-by-name lookup would let a
      # fork PR poison the baseline. Resolve from the latest successful main-push
      # run of this workflow instead, and bound the download (scheduling data only,
      # a few KB).
      - name: Fetch shard timings baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].id') || true
          url=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?name=ci-test-timings" --jq '.artifacts[0].archive_download_url') || true
          if [ -n "$url" ] && [ "$url" != "null" ]; then
            curl -fsL --max-filesize 1048576 -H "Authorization: Bearer ${GH_TOKEN}" -o ci-test-timings.zip "$url" || true
            unzip -p ci-test-timings.zip ci-test-timings.json > ci-test-timings.json || true
          fi
          # An empty baseline is worse than none: without -f curl writes the HTTP error
          # body, unzip then leaves a 0-byte file, and JSON.parse('') fails the plan job.
          [ -s ci-test-timings.json ] || rm -f ci-test-timings.json
      - id: plan
        run: node packages/vitest-config/src/ci-shards.ts plan --timings ci-test-timings.json

  build:
    name: build + test (${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-latest
    # Browsers and their OS deps come baked into the official Playwright image
    # (playwright.dev/docs/ci#via-containers), so no job downloads or apt-installs
    # them. The tag must equal the lockfile's playwright version or Playwright
    # cannot find its browsers; repo checks fail on drift. The multi-arch index
    # digest pins it the way the actions are pinned by SHA. --user 1001 is the
    # runner's uid (Firefox refuses a HOME owned by another user); --init and
    # --ipc=host follow playwright.dev/docs/docker.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --user 1001 --init --ipc=host
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.7.0 # keep in sync with packageManager in package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      # CI-gate caches. Safe ONLY while no workflow runs untrusted code on a trusted
      # ref (no pull_request_target): GitHub scopes cache writes per-ref, so fork PRs
      # cannot poison main's cache, and the publish job (release.yml) stays cache-free.
      # NOTE this ref-scoping is a CACHE property only — artifacts are repo-wide, which
      # is why the baseline fetches above pin to a main-push run instead of latest-by-name.
      # Turbo cache: scoped within a lockfile generation, so a dependency change
      # discards prior cache instead of carrying (and laundering) it forward.
      # Restore/save are split so artifacts of tasks that passed persist even when
      # the job fails (turbo only caches successful tasks) — the common red→green
      # PR loop keeps its warm cache. github.job + matrix.shard in the key stop the
      # three shards, and this job vs the fallow job, racing to save the same sha
      # (immutable keys: first save wins, second is rejected); run_attempt lets
      # re-runs save too. The restore prefix is unchanged, so every job still
      # shares every other job's saves.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-node26-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.job }}-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: turbo-node26-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: 1.16.0 # pinned: 'latest' does a GitHub Releases lookup that flakes CI
      - run: sfw pnpm i --frozen-lockfile # Socket Firewall blocks known-malicious packages at install
      - run: pnpm exec conciv-ci-shards run
        env:
          SHARD_PACKAGES: ${{ matrix.packages }}
      # Playwright keeps a trace.zip per failed embed IT (trace: retain-on-failure);
      # ship them so CI-only failures can be root-caused from the trace instead of
      # guessed at. Direct directory path, never a packages/** glob (see below).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: packages/embed/test-results/
          if-no-files-found: ignore
      # Collapse this shard's per-package results (vitest emits test-results.json
      # only in CI; turbo caches them so cache-hit packages still report) into ONE
      # file, then upload it by literal name. Never glob packages/** here: the
      # upload action would walk every node_modules in the workspace — minutes of
      # directory traversal to ship a few KB. Our own walker skips node_modules.
      # Inline failure annotations still come from vitest's github-actions reporter.
      - run: pnpm exec conciv-ci-shards report --output "shard-report-${SHARD_NAME}.json"
        if: always()
        env:
          SHARD_NAME: ${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.shard }}
          path: shard-report-${{ matrix.shard }}.json
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .turbo
          key: turbo-node26-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.job }}-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}

  # One merged test-results table for the whole shard matrix: downloads each
  # shard's collapsed report and renders a single job summary. On main pushes it
  # also derives the per-package durations and publishes the ci-test-timings
  # baseline the next planner run feeds on (push-only, like the bundle-size
  # baseline: PR-created artifacts never become the baseline). Runs from source
  # with no install, like the plan job.
  test-summary:
    name: test summary
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results-*
          merge-multiple: true
          path: shard-reports
      - run: node packages/vitest-config/src/ci-shards.ts summarize shard-reports
        if: github.event_name == 'pull_request'
      - run: node packages/vitest-config/src/ci-shards.ts summarize shard-reports --timings ci-test-timings.json
        if: github.event_name == 'push'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: ci-test-timings
          path: ci-test-timings.json

  # Whole-repo gates that don't belong to any one shard. Bundle size measures
  # every published dist, so it builds the full package graph itself (warm turbo
  # cache makes this cheap); the no-comments oxlint pass covers apps/ too.
  repo-checks:
    name: repo checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # download the bundle-size baseline artifact from the latest main run
    steps:
      # Shallow (default depth-1) is enough here: this job only runs the plain
      # check-changesets (name validation against HEAD, no base diff). The
      # --require-coverage diff against the PR's base sha - which needs full
      # history - runs in the dedicated verify-changesets.yml workflow instead.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.7.0 # keep in sync with packageManager in package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-node26-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.job }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: turbo-node26-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: 1.16.0 # pinned: 'latest' does a GitHub Releases lookup that flakes CI
      - run: sfw pnpm i --frozen-lockfile # Socket Firewall blocks known-malicious packages at install
      # Turns a post-merge-only release failure into a red PR check: validates every
      # .changeset/*.md names a package that actually exists in the workspace before
      # `changeset version` ever runs (see conciv-publish version, which runs the same
      # guard). Runs straight from source (bin resolves src/cli.ts, no build needed).
      # This is the name-only check on push/main and every PR; the PR-only
      # --require-coverage check runs in verify-changesets.yml, which can also
      # retrigger on label changes (pull_request's default types can't).
      - run: pnpm exec conciv-publish check-changesets
      - run: pnpm exec conciv-publish check-catalog
      # The browser jobs' container image must be one digest-pinned reference whose tag
      # is the playwright version the lockfile resolves, else Playwright looks for
      # browser builds the image does not have. Dependabot cannot bump container images
      # (dependabot/dependabot-core#5819), so this is the guard.
      - name: Playwright image matches lockfile
        run: |
          want="mcr.microsoft.com/playwright:v$(node -p "require('playwright/package.json').version")-noble"
          found=$(grep -ohE 'mcr\.microsoft\.com/playwright:v[0-9][^[:space:]]*' .github/workflows/*.yml | sort -u)
          if [ "$(printf '%s\n' "$found" | wc -l)" -ne 1 ] || [ "${found%@sha256:*}" != "$want" ] ||
            ! printf '%s' "$found" | grep -qE '@sha256:[0-9a-f]{64}$'; then
            echo "::error::Playwright image drift: workflows use [${found}], want one ${want}@sha256:<digest>"
            exit 1
          fi
      # Build the site too so bundle-size can measure the Cloudflare worker and gate it below.
      - run: pnpm exec turbo run build --filter='./packages/*' --filter='./packages/extensions/*' --filter=site
      # Token codegen drift: the base token sheet, every class-scoped skin block and both
      # generated contract docs come from the typed skin definitions and are committed.
      # Regenerate them in memory and fail if the committed files disagree.
      - name: Token codegen drift
        run: pnpm --filter @conciv/ui-kit-system run gen:check
      # Bundle size: measure published dists, diff against the baseline saved by the
      # latest main run. PRs read the baseline; pushes to main publish a fresh one.
      # Pinned to a main-push run for the same artifact-poisoning reason as the
      # planner's timings fetch.
      - name: Fetch bundle-size baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].id') || true
          url=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?name=bundle-size-baseline" --jq '.artifacts[0].archive_download_url') || true
          if [ -n "$url" ] && [ "$url" != "null" ]; then
            curl -fsL --max-filesize 10485760 -H "Authorization: Bearer ${GH_TOKEN}" -o bundle-size-baseline.zip "$url" || true
            unzip -p bundle-size-baseline.zip bundle-size.json > bundle-size-baseline.json || true
          fi
          # An empty baseline is worse than none: it used to crash the size gate on a fetch miss.
          [ -s bundle-size-baseline.json ] || rm -f bundle-size-baseline.json
      # Reports every package + the conciv.dev Cloudflare worker (Δ vs main), and fails only if the
      # worker exceeds its 3 MiB gzip free-plan limit (over it `wrangler deploy` fails with 10027).
      - run: pnpm exec conciv-bundle-size --output bundle-size.json --baseline bundle-size-baseline.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: bundle-size-baseline
          path: bundle-size.json
      # Enforce the no-comments rule everywhere (incl. apps/), without pulling the private apps into the build/test gate.
      - run: pnpm exec oxlint -A all -D conciv/no-comments
      - name: Skill format
        run: pnpm --filter @conciv/skills exec intent validate skills --check --github-summary
      - name: Skill references
        run: pnpm --filter @conciv/skills run check:refs
      - name: Skill staleness (non-blocking)
        continue-on-error: true
        run: |
          echo '### Skill staleness' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          pnpm --filter @conciv/skills exec intent stale --json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .turbo
          key: turbo-node26-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.job }}-${{ github.sha }}-${{ github.run_attempt }}

  # The branch ruleset requires the exact context "build + test"; this gate keeps
  # that context alive over the planner + shard matrix + repo checks. always() so
  # a failed or cancelled dependency fails the gate instead of skipping it.
  build-gate:
    name: build + test
    needs: [plan, build, repo-checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.plan.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.repo-checks.result }}" = "success"

  storybook:
    name: Storybook browser tests
    runs-on: ubuntu-latest
    # Same Playwright image as the build job (see there).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --user 1001 --init --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.7.0 # keep in sync with packageManager in package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-node26-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.job }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: turbo-node26-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: 1.16.0 # pinned: 'latest' does a GitHub Releases lookup that flakes CI
      - run: sfw pnpm i --frozen-lockfile # Socket Firewall blocks known-malicious packages at install
      # Alone on its own runner: nothing else competes for chromium/vite/cpu, so the merged suite's
      # maxWorkers:2 is safe and the heavy solid-streamdown cold-load has headroom. Dependency
      # builds are capped so a cold turbo cache (lockfile change) can't OOM chrome mid-run.
      - run: pnpm exec turbo run typecheck lint test --filter='./apps/storybook'
      - run: pnpm exec conciv-ci-summary apps/storybook
        if: always()
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .turbo
          key: turbo-node26-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.job }}-${{ github.sha }}-${{ github.run_attempt }}

  # The e2e consumer apps are sharded by the same timing-driven LPT planner as the
  # package suites, just with a different pool (every e2e/* and apps/* package that
  # actually declares a test:e2e script) and bigger bins: each e2e shard repays
  # ~3 minutes of setup (image pull, install, dependency builds), so packing them too
  # thin costs more than it saves. Weights come from the e2e-test-timings artifact
  # published by the last main push; because playwright json only reports per-case
  # durations (server boot is invisible to it) the planner also charges every app a
  # fixed overhead, otherwise a 15-app pool would look nearly free and collapse to
  # the minimum two shards.
  plan-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # download the e2e-test-timings artifact from the latest main run
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # Same artifact-poisoning posture as the package planner: artifacts are NOT
      # ref-scoped, so resolve the baseline from the latest successful main-push run
      # of this workflow instead of a repo-wide latest-by-name lookup, and bound the
      # download (scheduling data only, a few KB).
      - name: Fetch e2e shard timings baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].id') || true
          url=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?name=e2e-test-timings" --jq '.artifacts[0].archive_download_url') || true
          if [ -n "$url" ] && [ "$url" != "null" ]; then
            curl -fsL --max-filesize 1048576 -H "Authorization: Bearer ${GH_TOKEN}" -o e2e-test-timings.zip "$url" || true
            unzip -p e2e-test-timings.zip e2e-test-timings.json > e2e-test-timings.json || true
          fi
          # An empty baseline is worse than none: without -f curl writes the HTTP error
          # body, unzip then leaves a 0-byte file, and JSON.parse('') fails the plan job.
          [ -s e2e-test-timings.json ] || rm -f e2e-test-timings.json
      - id: plan
        run: node packages/vitest-config/src/ci-shards.ts plan --task e2e --timings e2e-test-timings.json

  e2e:
    name: e2e consumer apps (${{ matrix.shard }})
    needs: plan-e2e
    runs-on: ubuntu-latest
    # Same Playwright image as the build job (see there).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --user 1001 --init --ipc=host
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-e2e.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.7.0 # keep in sync with packageManager in package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      # Same cache-poisoning posture as the build job: turbo cache scoped within a
      # lockfile generation. matrix.shard is in
      # the save key so the shards don't race to save the same immutable key. The
      # extra turbo restore-key falls back to the build job's cache so package builds
      # (embed, plugin, ...) restore instead of rebuilding.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-e2e-node26-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            turbo-e2e-node26-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-node26-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: 1.16.0 # pinned: 'latest' does a GitHub Releases lookup that flakes CI
      - run: sfw pnpm i --frozen-lockfile # Socket Firewall blocks known-malicious packages at install
      # Real harness CLIs for the e2e/harnesses turn matrix: unauthenticated turns must
      # surface a visible error (proving spawn + stream + error plumbing), never hang or
      # vanish. pi is a stub harness and never spawns its binary. Only the shard that
      # owns conciv-e2e-harnesses pays for this install.
      # sfw exits 0 even when it crashes mid-install ("Socket Firewall encountered an
      # unexpected error: TypeError: fetch failed"), so a green step used to mean nothing
      # and the missing CLI surfaced much later as `claude: not found` inside a turn
      # assertion. Success is keyed on the binaries resolving, never on the exit code.
      - name: Install harness CLIs
        if: matrix.harnesses
        run: |
          packages="@anthropic-ai/claude-code@2.1.212 @openai/codex@0.144.5 @google/gemini-cli@0.51.0 opencode-ai@1.18.3"
          missing=""
          for attempt in 1 2 3; do
            sfw npm install -g $packages || echo "attempt ${attempt}: sfw npm install -g reported a failure"
            missing=""
            for binary in claude codex gemini opencode; do
              command -v "$binary" >/dev/null 2>&1 || missing="${missing} ${binary}"
            done
            if [ -z "$missing" ]; then
              exit 0
            fi
            echo "attempt ${attempt}: harness CLIs still missing:${missing}"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          echo "::error::harness CLI install failed after 3 attempts; missing binaries:${missing}"
          exit 1
      # Consumer-shape suites: dist widget in CLI-scaffolded apps (root e2e/) plus the
      # site's own e2e suite. test:e2e is cache:false in turbo.json, so every run
      # exercises the real servers; --concurrency=1 keeps a shard's apps serial because
      # they bind fixed ports.
      - run: pnpm exec conciv-ci-shards run --task e2e
        env:
          SHARD_PACKAGES: ${{ matrix.packages }}
      # Collapse this shard's playwright/vitest reports into ONE file and upload it by
      # literal name; never glob e2e/** here, the upload action would walk every
      # node_modules in the workspace.
      - run: pnpm exec conciv-ci-shards report --task e2e --output "e2e-report-${SHARD_NAME}.json"
        if: always()
        env:
          SHARD_NAME: ${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-results-${{ matrix.shard }}
          path: e2e-report-${{ matrix.shard }}.json

  # One merged e2e table for the whole shard matrix, and on main pushes the
  # e2e-test-timings baseline the next plan-e2e run feeds on (push-only, so a PR
  # can never become the baseline). Runs from source with no install.
  e2e-summary:
    name: e2e summary
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-results-*
          merge-multiple: true
          path: e2e-reports
      - run: node packages/vitest-config/src/ci-shards.ts summarize --task e2e e2e-reports
        if: github.event_name == 'pull_request'
      - run: node packages/vitest-config/src/ci-shards.ts summarize --task e2e e2e-reports --timings e2e-test-timings.json
        if: github.event_name == 'push'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: e2e-test-timings
          path: e2e-test-timings.json

  # The branch ruleset requires the exact context "e2e consumer apps"; this gate
  # keeps that context alive over the planner + shard matrix, like build-gate does
  # for "build + test". always() so a failed or cancelled dependency fails the gate
  # instead of skipping it.
  e2e-gate:
    name: e2e consumer apps
    needs: [plan-e2e, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.plan-e2e.result }}" = "success"
          test "${{ needs.e2e.result }}" = "success"

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false # fail the job on workflow-security findings instead of uploading SARIF
