library:
  name: '@conciv/skills'
  version: '0.0.18'
  repository: 'https://github.com/conciv-dev/conciv'
  description: 'Agent-facing skills covering conciv, a dev-only chat widget plus engine that lets a coding agent read and act on a running app.'
  primary_framework: 'framework-agnostic'

domains:
  - name: 'Installation & mounting'
    slug: 'installation'
    description: 'Getting the widget script into a build and a running app for the first time.'
  - name: 'Extension authoring'
    slug: 'extension-authoring'
    description: 'Adding project-specific tools, attachments, and UI to the widget from a consuming app.'
  - name: 'Harness adapters'
    slug: 'harness-adapters'
    description: 'Wiring a new coding-agent CLI into conciv as the process behind the chat.'
  - name: 'Runtime debugging'
    slug: 'runtime-debugging'
    description: 'Diagnosing the sandbox/gate/SSE runtime once the widget is installed and running.'

skills:
  - name: 'Setting up conciv'
    slug: 'conciv-setup'
    domain: 'installation'
    description: 'Installing or mounting the conciv dev-agent widget in an app: bundler plugin vs manual mount, harness selection, and the ConcivConfig/ConcivSettingsInit surface.'
    type: 'core'
    packages:
      - '@conciv/it'
      - '@conciv/embed'
      - '@conciv/react'
      - '@conciv/preact'
      - '@conciv/solid'
      - '@conciv/cli'
    covers:
      - '@conciv/it plugin exports (vite, nextjs, webpack, rspack, rollup, esbuild)'
      - 'createConciv / mountConciv manual mount'
      - 'ConcivConfig and ConcivSettingsInit fields'
      - 'production-gating the widget with enabled'
    tasks:
      - 'add @conciv/it to a Vite or Next.js build'
      - 'wire a manual createConciv/mountConciv setup for a bundler with no plugin'
      - 'pick and configure a harness (claude/codex)'
      - 'gate the widget out of a production build'
    failure_modes:
      - mistake: 'assuming Rollup/esbuild plugin entries boot the engine'
        mechanism: 'those plugin entries are documented no-ops today; only Vite and Next.js inject the widget and boot the engine automatically.'
        wrong_pattern: |
          import conciv from '@conciv/it/plugin/rollup'
          export default {plugins: [conciv()]}
        correct_pattern: |
          import {createConciv} from '@conciv/embed'
          createConciv({apiBase}).mount(document.getElementById('conciv-root'))
        source: 'packages/it/README.md'
        priority: 'HIGH'
        status: 'active'
        skills: ['conciv-setup']
      - mistake: 'shipping the widget to production with no enabled gate'
        mechanism: '`enabled` defaults to true (packages/core/src/config.ts), so an unguarded conciv() call stays live in a production bundle instead of being stripped at build time.'
        wrong_pattern: |
          conciv()
        correct_pattern: |
          conciv({enabled: process.env.NODE_ENV !== 'production'})
        source: 'packages/core/src/config.ts'
        priority: 'CRITICAL'
        status: 'active'
        skills: ['conciv-setup']

  - name: 'Building a conciv extension'
    slug: 'conciv-develop'
    domain: 'extension-authoring'
    description: 'Adding an agent tool, attachment type, or widget UI from a consuming app via defineExtension/defineTool/defineAttachment.'
    type: 'core'
    packages:
      - '@conciv/extension'
    covers:
      - 'defineExtension, defineTool, defineAttachment'
      - 'tool contract: server/client/render, errors, approval, meta'
      - 'getExtensionApi (extension surface) / @conciv/extension/host (host wiring surface)'
      - 'RPC to an extension server via makeExtRpcClient/subscriptionIterator'
      - '@conciv/extension-testkit'
    tasks:
      - 'add a defineTool that calls out to project infrastructure'
      - 'add UI to the widget composer or status slot via Component/Surface'
      - 'add a chat-attachment type via defineAttachment'
      - 'test an extension with @conciv/extension-testkit'
    failure_modes:
      - mistake: 'writing to app state inside a render body or subscription'
        mechanism: 'extension Component/Surface code compiles as Solid JSX even inside a React host; writes belong in event handlers, not render or effects.'
        wrong_pattern: |
          function Surface() {
            store.set(latestValue)
            return <div>{latestValue}</div>
          }
        correct_pattern: |
          function Surface() {
            const host = getExtensionApi(YOUR_NAME)
            return <button onClick={() => store.set(latestValue)}>Save</button>
          }
        source: 'packages/extension/src/extension-api.ts'
        priority: 'HIGH'
        status: 'active'
        skills: ['conciv-develop']
      - mistake: 'reading apps/site/content/docs/extending/*.mdx as the current extension contract'
        mechanism: 'those docs pages describe an older extension API; the type definitions in packages/extension/src are the source of truth.'
        wrong_pattern: |
          # copying an example straight from apps/site/content/docs/extending/*.mdx
        correct_pattern: |
          # verifying the shape against packages/extension/src/define-extension.ts and define-tool.ts first
        source: 'packages/extension/src/define-extension.ts'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['conciv-develop', 'conciv-debug']

  - name: 'Building a conciv harness adapter'
    slug: 'conciv-harness'
    domain: 'harness-adapters'
    description: 'Wiring a new coding-agent CLI into conciv as a HarnessAdapter: capabilities, connect.plan(), chatConfig(), and the models/history/connect/tty/commands sidecars.'
    type: 'core'
    packages:
      - '@conciv/harness'
      - '@conciv/protocol'
    covers:
      - 'HarnessAdapter / defineHarness'
      - 'HarnessCapabilities compile-time gating'
      - 'chatConfig() returning a @tanstack/ai-* text adapter'
      - 'connect.plan() launch args'
      - 'sandbox-virtual cwd handling'
    tasks:
      - 'add a new harness id for a coding-agent CLI'
      - 'debug a harness turn that misbehaves around cwd, resume, or transcript history'
      - 'decide which HarnessCapabilities flags apply to a new CLI'
    failure_modes:
      - mistake: 'spawning or decoding the CLI directly instead of returning a text adapter from chatConfig()'
        mechanism: 'chat() (with the conciv sandbox + permission-gate middleware) owns process lifecycle; a harness that bypasses it duplicates process management and loses abort handling.'
        wrong_pattern: |
          chatConfig: () => ({adapter: makeCustomProcessAdapter(spawnCli())})
        correct_pattern: |
          chatConfig: (deps) => ({adapter: yourTextAdapter(deps)})
        source: 'packages/core/src/chat/run.ts'
        priority: 'CRITICAL'
        status: 'active'
        skills: ['conciv-harness']
      - mistake: 'passing a host-absolute cwd into an adapter config'
        mechanism: 'localProcessSandbox({dir: cwd}) makes the sandbox root BE deps.cwd; a CLI defaulting to /workspace when cwd is not threaded through nests a junk Users/... tree inside the workspace.'
        wrong_pattern: |
          connect: {plan: (ctx) => ['your-cli', '--cwd', process.cwd()]}
        correct_pattern: |
          connect: {plan: (ctx) => ['your-cli', '--cwd', ctx.cwd]}
        source: 'packages/core/src/chat/sandbox.ts'
        priority: 'HIGH'
        status: 'active'
        skills: ['conciv-harness']

  - name: 'Debugging a conciv integration'
    slug: 'conciv-debug'
    domain: 'runtime-debugging'
    description: 'Diagnosing a conciv widget that is installed but misbehaving at runtime: missing widget, stuck tool calls, stalled approvals, port conflicts, and SSE stream quirks.'
    type: 'core'
    packages:
      - '@conciv/it'
      - '@conciv/embed'
      - '@conciv/protocol'
    covers:
      - 'widget mount/connect probing'
      - 'permission-gate timeout vs no-listener refusal paths'
      - 'engine port fallback behavior'
      - 'SSE stream lifecycle and Playwright networkidle'
    tasks:
      - 'diagnose why the conciv button never appears'
      - 'diagnose a tool call that hangs then fails'
      - 'diagnose an approval card that never resolves'
      - 'fix a Playwright test that hangs against the live widget'
    failure_modes:
      - mistake: 'treating every approval failure as a user denial'
        mechanism: 'approvalRefusal produces different wording for `deny` vs `timeout`, and makeAskGate auto-denies with no ask at all when sessionId is empty; conflating the three hides the real cause.'
        wrong_pattern: |
          # assuming "approval failed" always means the user clicked Deny
        correct_pattern: |
          # reading whether the refusal message says "denied by the user" or "the ask timed out"
        source: 'packages/core/src/chat/gate.ts'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['conciv-debug']
      - mistake: 'using Playwright networkidle against a page with the live widget'
        mechanism: 'the SSE session stream stays open for the life of the mounted widget, so the network is never idle while a session is mounted.'
        wrong_pattern: |
          await page.waitForLoadState('networkidle')
        correct_pattern: |
          await page.waitForLoadState('domcontentloaded')
        source: 'packages/core/src/chat/subscribe.ts'
        priority: 'HIGH'
        status: 'active'
        skills: ['conciv-debug']

tensions:
  - name: 'fail-fast vs wait-for-a-human'
    skills: ['conciv-harness', 'conciv-debug']
    description: 'Code-mode tool calls refuse instantly when nothing is listening on a session, while normal chat tool calls wait up to two minutes for an approval before timing out.'
    implication: 'An agent debugging "a tool call hangs" needs to know which gate path it is in before assuming the fix is the same for both.'

cross_references:
  - from: 'conciv-debug'
    to: 'conciv-setup'
    reason: 'Most "widget never appears" symptoms trace back to the install path (bundler plugin vs manual mount) that conciv-setup owns.'
  - from: 'conciv-debug'
    to: 'conciv-harness'
    reason: 'A stuck first-response with no tool call involved is a harness/CLI problem, not a gate problem — conciv-harness covers adapter wiring.'
  - from: 'conciv-develop'
    to: 'conciv-debug'
    reason: 'An extension tool with approval: "ask" goes through the same gate/timeout mechanism conciv-debug documents.'

